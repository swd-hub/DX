<html>
<head>
    <title>Data Manager</title>
</head>
<body>
    <h1>Data Manager</h1>
    <form>
        <label for="dedupCheckbox">各項目かつ内容ごとの最終更新日データのみ抽出</label>
        <input type="checkbox" id="dedupCheckbox"/>
        <br/>
        <button type="submit">Process Data</button>
    </form>
    <script>
        function processData(data) {
            const groupedData = {};
            data.forEach(record => {
                const key = `${record.name}-${record.item}-${record.content}`;
                if (!groupedData[key] || new Date(record.date) > new Date(groupedData[key].date)) {
                    groupedData[key] = record;
                }
            });
            return Object.values(groupedData);
        }
    </script>
</body>
</html>
