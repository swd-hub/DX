<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools List</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            overflow: hidden;
            text-align: center;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            border-bottom: 2px solid #6a11cb;
        }
        .card h3 {
            color: #2575fc;
            margin: 10px 0;
        }
        .card p {
            padding: 0 10px;
            color: #595959;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="tool1.jpg" alt="Tool 1">
            <h3>Tool 1</h3>
            <p>Description of tool 1.</p>
        </div>
        <div class="card">
            <img src="tool2.jpg" alt="Tool 2">
            <h3>Tool 2</h3>
            <p>Description of tool 2.</p>
        </div>
        <div class="card">
            <img src="tool3.jpg" alt="Tool 3">
            <h3>Tool 3</h3>
            <p>Description of tool 3.</p>
        </div>
        <!-- Add more cards as needed -->
    </div>
</body>
</html>
